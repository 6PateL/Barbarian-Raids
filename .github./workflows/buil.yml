name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the project is complete
        run: |
          test -d src/main/java || (echo "::error::Папка src/main/java відсутня в репозиторії. Завантажте всю папку src з архіву." && exit 1)
          test -f src/main/resources/META-INF/mods.toml || (echo "::error::Відсутній src/main/resources/META-INF/mods.toml" && exit 1)

      - name: Download Create and Recruits jars (if libs/ is missing)
        run: |
          BASE=https://github.com/6PateL/trainrecruits/raw/main/libs
          mkdir -p libs/create-deps
          for f in create-1.20.1-6.0.8.jar recruits-1.20.1-1.15.2.jar \
                   create-deps/Ponder-Forge-1.20.1-1.0.91.jar create-deps/Registrate-MC1.20-1.3.3.jar \
                   create-deps/flywheel-forge-1.20.1-1.0.5.jar create-deps/mixinextras-forge-0.4.1.jar; do
            if [ ! -s "libs/$f" ]; then curl -fsSL -o "libs/$f" "$BASE/$f"; fi
          done
          ls -la libs libs/create-deps

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: barbarianraids-jar
          path: build/libs/*.jar
